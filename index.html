<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keep Talking English Activity</title>

<style>
:root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --green: #10b981;
  --green-hover: #059669;
  --red: #ef4444;
  --red-hover: #dc2626;
  --bg-overlay: rgba(15, 23, 42, 0.45);
  --card-bg: rgba(255, 255, 255, 0.95);
  --text: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 40px 20px;
  background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), url('https://m.media-amazon.com/images/I/710nQYBctSL.jpg') no-repeat center center fixed;
  background-size: cover;
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 750px;
}

header {
  text-align: center;
  margin-bottom: 32px;
}

header h1 {
  margin: 0 0 8px;
  font-size: 40px;
  font-weight: 800;
  color: #ffffff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  letter-spacing: -0.5px;
}

header p {
  margin: 0;
  color: #f1f5f9;
  font-size: 17px;
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
}

.card {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  padding: 45px;
  border-radius: 28px;
  margin-bottom: 20px;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.4);
}

label {
  display: block;
  font-weight: 700;
  margin-bottom: 24px;
  text-align: center;
  font-size: 24px;
  color: var(--text);
}

/* Extra Large 4 Separate Code Boxes Container */
.code-boxes {
  display: flex;
  gap: 20px;
  margin-bottom: 24px;
  justify-content: center;
  align-items: center;
}

.code-box {
  width: 120px;
  height: 140px;
  text-align: center;
  font-size: 68px;
  font-weight: 800;
  border: 4px solid var(--border);
  border-radius: 24px;
  background: #fff;
  color: var(--text);
  transition: all 0.2s ease;
  box-shadow: inset 0 3px 6px rgba(0,0,0,0.06);
}

.code-box.fixed {
  background: #f1f5f9;
  color: var(--text-muted);
  border-color: #cbd5e1;
}

.code-box:focus {
  border-color: var(--primary);
  outline: none;
  box-shadow: 0 0 0 8px rgba(79, 70, 229, 0.2);
}

/* Modal Popup Overlay with Extra Large Fonts */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(5px);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  animation: fadeIn 0.2s ease-in-out;
}

.student-modal {
  background: #ffffff;
  border-radius: 28px;
  padding: 45px;
  width: 90%;
  max-width: 580px;
  text-align: center;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  border: 1px solid var(--border);
  animation: scaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes scaleUp {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

.student-modal .code-badge {
  display: inline-block;
  background: var(--primary);
  color: white;
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 14px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.student-modal h2 {
  margin: 0 0 10px;
  font-size: 52px;
  font-weight: 800;
  color: var(--primary);
  line-height: 1.1;
}

.student-modal .chinese-name {
  font-size: 36px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 12px;
}

.student-modal .class-info {
  font-size: 18px;
  color: var(--text-muted);
  margin-bottom: 24px;
}

.student-modal .status-text {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 28px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

button {
  border: none;
  padding: 18px;
  border-radius: 14px;
  color: white;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: filter 0.2s, transform 0.1s;
}

button:active { transform: scale(0.98); }
button:hover { filter: brightness(1.05); }

.pass { background: var(--green); }
.retry { background: var(--red); }
.primary-btn { background: var(--primary); width: 100%; }
.gray-btn { background: rgba(15, 23, 42, 0.75); color: white; backdrop-filter: blur(5px); }

.message {
  padding: 14px;
  border-radius: 12px;
  margin-top: 20px;
  display: none;
  font-weight: 600;
  text-align: center;
  font-size: 15px;
}

.success { display: block; color: #065f46; background: #ecfdf5; border: 1px solid #a7f3d0; }
.error { display: block; color: #991b1b; background: #fef2f2; border: 1px solid #fecaca; }

/* Toggle Summary Section */
.toggle-bar {
  text-align: center;
  margin-top: 10px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}

.stat {
  text-align: center;
  padding: 16px 8px;
  border-radius: 14px;
  background: #f8fafc;
  border: 1px solid var(--border);
}

.stat span {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
}

.stat strong {
  display: block;
  font-size: 22px;
  margin-top: 4px;
  color: var(--text);
}

.green-text { color: var(--green); }
.red-text { color: var(--red); }

.table-wrap {
  overflow-x: auto;
  max-height: 280px;
  margin-top: 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 500px;
  background: white;
  font-size: 14px;
}

th, td {
  text-align: left;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}

th {
  background: #f8fafc;
  position: sticky;
  top: 0;
  font-weight: 600;
  color: var(--text-muted);
}

.status-PASS { color: var(--green); font-weight: 700; }
.status-TRY-AGAIN { color: var(--red); font-weight: 700; }
</style>
</head>

<body>
<div class="container">

<header>
  <h1>Keep Talking English Activity</h1>
  <p>Enter the 4-digit student code to check attendance and evaluate speaking</p>
</header>

<section class="card">
  <label>Student Code Input</label>
  
  <!-- Extra Large 4 Input Boxes (Box 1 fixed to '5') -->
  <div class="code-boxes">
    <input type="text" class="code-box fixed" value="5" disabled title="Grade 5">
    <input type="text" class="code-box" id="digit1" maxlength="1" inputmode="numeric" autocomplete="off" autofocus title="Class (1-7)">
    <input type="text" class="code-box" id="digit2" maxlength="1" inputmode="numeric" autocomplete="off" title="Number Digit 1">
    <input type="text" class="code-box" id="digit3" maxlength="1" inputmode="numeric" autocomplete="off" title="Number Digit 2">
  </div>

  <div id="message" class="message" role="status"></div>
</section>

<!-- Modal Popup Container -->
<div id="studentModal" class="modal-overlay" style="display: none;">
  <div id="studentCard" class="student-modal"></div>
</div>

<!-- Toggle Summary Section -->
<div class="toggle-bar">
  <button class="gray-btn" onclick="toggleSummary()" id="toggleBtn" style="padding: 12px 24px; border-radius: 12px; font-size: 14px;">📊 Show Summary & Export Panel</button>
</div>

<section class="card" id="summaryCard" style="display: none; margin-top: 20px;">
  <h2 style="margin-top: 0; font-size: 20px; margin-bottom: 16px;">Activity Summary</h2>
  <div class="stats">
    <div class="stat"><span>Total</span><strong id="total">163</strong></div>
    <div class="stat"><span>Passed</span><strong id="passed" class="green-text">0</strong></div>
    <div class="stat"><span>Retry</span><strong id="retried" class="red-text">0</strong></div>
    <div class="stat"><span>Pending</span><strong id="unchecked">163</strong></div>
  </div>
  <p id="rate" style="margin-bottom: 16px; color: var(--text-muted); font-size: 14px; text-align: center;">Pass rate: 0% of checked students</p>
  
  <div style="display: flex; gap: 10px; margin-bottom: 16px;">
    <button class="primary-btn" style="padding: 12px; font-size: 14px;" onclick="downloadExcelReport()">⬇ Download Colored Excel Report</button>
    <button class="gray-btn" style="padding: 12px; font-size: 14px; background: #64748b;" onclick="resetSession()">⚙️ Reset All</button>
  </div>

  <label for="filter" style="font-size: 14px; text-align: left; margin-bottom: 8px;">Filter Results:</label>
  <select id="filter" onchange="renderTable()" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; background: white;">
    <option value="ALL">All students</option>
    <option value="PASS">Passed</option>
    <option value="TRY AGAIN">Try Again</option>
    <option value="UNCHECKED">Not checked</option>
  </select>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Code</th>
          <th>Class</th>
          <th>No.</th>
          <th>English Name</th>
          <th>Chinese Name</th>
          <th>Result</th>
        </tr>
      </thead>
      <tbody id="results"></tbody>
    </table>
  </div>
</section>

</div>

const students = rawData.map(([cls, number, chinese, english]) => {
  const paddedNum = number.padStart(2, '0');
  return {
    grade: "5",
    class: cls,
    number: paddedNum,
    chinese,
    english,
    code: "5" + cls + paddedNum
  };
});

let records = {};
try {
  records = JSON.parse(localStorage.getItem("keepTalkingEnglishRecords") || "{}");
} catch {
  records = {};
}

let currentStudent = null;

const d1 = document.getElementById("digit1");
const d2 = document.getElementById("digit2");
const d3 = document.getElementById("digit3");
const digitInputs = [d1, d2, d3];

const studentModal = document.getElementById("studentModal");
const studentCard = document.getElementById("studentCard");
const messageBox = document.getElementById("message");

digitInputs.forEach((input, index) => {
  input.addEventListener("input", (e) => {
    const val = e.target.value.replace(/\D/g, "");
    e.target.value = val;
    if (val && index < digitInputs.length - 1) {
      digitInputs[index + 1].focus();
    }
    checkAndLookup();
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Backspace" && !input.value && index > 0) {
      digitInputs[index - 1].focus();
      digitInputs[index - 1].value = "";
      checkAndLookup();
    }
  });
});

function getCombinedCode() {
  return "5" + digitInputs.map(i => i.value).join("");
}

function checkAndLookup() {
  const code = getCombinedCode();
  currentStudent = null;
  messageBox.className = "message";
  messageBox.textContent = "";

  if (code.length !== 4) {
    studentModal.style.display = "none";
    return;
  }

  const found = students.find(s => s.code === code);

  if (!found) {
    messageBox.textContent = "Student Not Found. Please check the code.";
    messageBox.className = "message error";
    studentModal.style.display = "none";
    return;
  }

  currentStudent = found;
  const currentStatus = records[found.code]?.status || "Not checked";

  studentCard.replaceChildren();

  const codeBadge = document.createElement("div");
  codeBadge.className = "code-badge";
  codeBadge.textContent = "ID: " + found.code;

  const heading = document.createElement("h2");
  heading.textContent = found.english;

  const chineseName = document.createElement("div");
  chineseName.className = "chinese-name";
  chineseName.textContent = found.chinese;

  const classInfo = document.createElement("div");
  classInfo.className = "class-info";
  classInfo.textContent = "Class " + found.class + " · No. " + found.number;

  const statusDiv = document.createElement("div");
  statusDiv.className = "status-text";
  statusDiv.textContent = "Current Status: " + currentStatus;

  const btnContainer = document.createElement("div");
  btnContainer.className = "buttons";

  const passBtn = document.createElement("button");
  passBtn.className = "pass";
  passBtn.textContent = "✓ PASS";
  passBtn.onclick = () => recordResult('PASS');

  const retryBtn = document.createElement("button");
  retryBtn.className = "retry";
  retryBtn.textContent = "↻ TRY AGAIN";
  retryBtn.onclick = () => recordResult('TRY AGAIN');

  btnContainer.append(passBtn, retryBtn);
  studentCard.append(codeBadge, heading, chineseName, classInfo, statusDiv, btnContainer);
  
  studentModal.style.display = "flex";
}

function recordResult(status) {
  if (!currentStudent) return;

  records[currentStudent.code] = {
    ...currentStudent,
    status,
    updatedAt: new Date().toLocaleString()
  };

  saveRecords();
  renderAll();

  if (status === 'PASS') {
    messageBox.textContent = currentStudent.english + " (" + currentStudent.chinese + ") successfully recorded as PASS!";
    messageBox.className = "message success";
  } else {
    messageBox.textContent = currentStudent.english + " (" + currentStudent.chinese + ") marked as TRY AGAIN. Ready for re-test.";
    messageBox.className = "message error";
  }

  studentModal.style.display = "none";
  digitInputs.forEach(i => i.value = "");
  currentStudent = null;
  d1.focus();
}

function saveRecords() {
  try {
    localStorage.setItem("keepTalkingEnglishRecords", JSON.stringify(records));
  } catch {
    console.error("Storage error");
  }
}

function toggleSummary() {
  const card = document.getElementById("summaryCard");
  const btn = document.getElementById("toggleBtn");
  if (card.style.display === "none") {
    card.style.display = "block";
    btn.textContent = "📊 Hide Summary & Export Panel";
  } else {
    card.style.display = "none";
    btn.textContent = "📊 Show Summary & Export Panel";
  }
}

function renderAll() {
  const passed = students.filter(s => records[s.code]?.status === "PASS").length;
  const retried = students.filter(s => records[s.code]?.status === "TRY AGAIN").length;

  const checked = passed + retried;
  const unchecked = students.length - checked;

  document.getElementById("total").textContent = students.length;
  document.getElementById("passed").textContent = passed;
  document.getElementById("retried").textContent = retried;
  document.getElementById("unchecked").textContent = unchecked;

  document.getElementById("rate").textContent =
    "Pass rate: " + (checked ? Math.round(passed / checked * 100) : 0) + "% of checked students (" + checked + " checked)";

  renderTable();
}

function renderTable() {
  const filter = document.getElementById("filter").value;
  const tbody = document.getElementById("results");
  tbody.replaceChildren();

  students
    .filter(s => {
      const status = records[s.code]?.status || "UNCHECKED";
      return filter === "ALL" || status === filter;
    })
    .forEach(s => {
      const status = records[s.code]?.status || "Not checked";
      const tr = document.createElement("tr");

      [
        s.code,
        s.class,
        s.number,
        s.english,
        s.chinese,
        status
      ].forEach((value, index) => {
        const td = document.createElement("td");
        td.textContent = value;

        if (index === 5 && status !== "Not checked") {
          td.className = status === "PASS" ? "status-PASS" : "status-TRY-AGAIN";
        }

        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });
}

function escapeXML(str) {
  return String(str ?? "")
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

function downloadExcelReport() {
  let rowsXML = '';

  // Header Row
  rowsXML += `<Row>
    <Cell><Data ss:Type="String">Code</Data></Cell>
    <Cell><Data ss:Type="String">Grade</Data></Cell>
    <Cell><Data ss:Type="String">Class</Data></Cell>
    <Cell><Data ss:Type="String">Student Number</Data></Cell>
    <Cell><Data ss:Type="String">English Name</Data></Cell>
    <Cell><Data ss:Type="String">Chinese Name</Data></Cell>
    <Cell><Data ss:Type="String">Result</Data></Cell>
    <Cell><Data ss:Type="String">Last Updated</Data></Cell>
  </Row>`;

  students.forEach(s => {
    const status = records[s.code]?.status || "Not checked";
    const updatedAt = records[s.code]?.updatedAt || "";
    
    let styleID = "StyleYellow"; // Awaiting / Not checked
    if (status === "PASS") styleID = "StyleGreen";
    else if (status === "TRY AGAIN") styleID = "StyleRed";

    rowsXML += `<Row>
      <Cell><Data ss:Type="String">${escapeXML(s.code)}</Data></Cell>
      <Cell><Data ss:Type="String">${escapeXML(s.grade)}</Data></Cell>
      <Cell><Data ss:Type="String">${escapeXML(s.class)}</Data></Cell>
      <Cell><Data ss:Type="String">${escapeXML(s.number)}</Data></Cell>
      <Cell><Data ss:Type="String">${escapeXML(s.english)}</Data></Cell>
      <Cell><Data ss:Type="String">${escapeXML(s.chinese)}</Data></Cell>
      <Cell ss:StyleID="${styleID}"><Data ss:Type="String">${escapeXML(status)}</Data></Cell>
      <Cell><Data ss:Type="String">${escapeXML(updatedAt)}</Data></Cell>
    </Row>`;
  });

  const excelXML = `<?xml version="1.0" encoding="UTF-8"?>
  <?mso-application progid="Excel.Sheet"?>
  <Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
    xmlns:o="urn:schemas-microsoft-com:office:office"
    xmlns:x="urn:schemas-microsoft-com:office:excel"
    xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"
    xmlns:html="http://www.w3.org/TR/REC-html40">
   <Styles>
    <Style ss:ID="Default" ss:Name="Normal">
     <Alignment ss:Vertical="Bottom"/>
     <Borders/>
     <Font ss:FontName="Arial" ss:Size="11"/>
     <Interior/>
     <Protection/>
    </Style>
    <Style ss:ID="StyleGreen">
     <Font ss:FontName="Arial" ss:Size="11" ss:Bold="1" ss:Color="#10B981"/>
    </Style>
    <Style ss:ID="StyleRed">
     <Font ss:FontName="Arial" ss:Size="11" ss:Bold="1" ss:Color="#EF4444"/>
    </Style>
    <Style ss:ID="StyleYellow">
     <Font ss:FontName="Arial" ss:Size="11" ss:Bold="1" ss:Color="#D97706"/>
    </Style>
   </Styles>
   <Worksheet ss:Name="Attendance Report">
    <Table>
     ${rowsXML}
    </Table>
   </Worksheet>
  </Workbook>`;

  const blob = new Blob([excelXML], { type: "application/vnd.ms-excel;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "keep-talking-english-attendance.xls";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function resetSession() {
  if (!confirm("Are you sure you want to reset all attendance records?")) return;
  records = {};
  saveRecords();
  digitInputs.forEach(i => i.value = "");
  currentStudent = null;
  studentModal.style.display = "none";
  messageBox.className = "message";
  messageBox.textContent = "";
  renderAll();
  d1.focus();
}

renderAll();
d1.focus();
